<!-- 8 - To write a Js function that takes marks as input and applies conditional logic and returns an appropriate grade (A , B , C or Fail) based on given criteria. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade Calculator Practical</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f9f9f9;
        }

        .container {
            background-color: white;
            padding: 30px;
            width: 300px;
            margin: 0 auto;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            width: 80%;
            margin-bottom: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #218838;
        }

        #result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Student Grade System</h2>
        <p>Enter your marks (0-100):</p>
        
        <input type="number" id="marksInput" placeholder="e.g. 85">
        <br>
        <button onclick="findGrade()">Get Grade</button>

        <div id="result"></div>
    </div>

    <script>
        function findGrade() {
            // 1. Get the value from the input box
            var marks = document.getElementById("marksInput").value;
            var message = "";
            var color = "black";

            // 2. Logic to decide the grade
            // Ensure input is not empty
            if (marks === "") {
                message = "Please enter marks.";
            } 
            else if (marks >= 90) {
                message = "Grade: A (Excellent)";
                color = "green";
            } 
            else if (marks >= 75) {
                message = "Grade: B (Very Good)";
                color = "blue";
            } 
            else if (marks >= 50) {
                message = "Grade: C (Pass)";
                color = "orange";
            } 
            else {
                message = "Grade: Fail (Study Harder)";
                color = "red";
            }

            // 3. Show the result on screen
            var resultBox = document.getElementById("result");
            resultBox.innerHTML = message;
            resultBox.style.color = color;
        }
    </script>

</body>
</html>
