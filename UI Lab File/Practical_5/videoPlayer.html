<!-- 5 - To create a simple responsive video player using HTML and CSS with embedded video controls for smooth playback on the webpage. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player Practical</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50; /* Dark background looks like a cinema */
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        /* Container to limit the video size on big screens */
        .video-container {
            max-width: 800px; /* Video won't get wider than this */
            margin: 30px auto; /* Centers the container */
            background-color: black;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Responsive Video Styling */
        video {
            width: 100%;       /* Forces video to fit the container width */
            height: auto;      /* Maintains aspect ratio (doesn't stretch) */
            border-radius: 5px;
            outline: none;
        }
    </style>
</head>
<body>

    <h1>My Responsive Video Player</h1>
    <p>Resize the browser window to see the player adjust.</p>

    <div class="video-container">
        <video controls poster="https://via.placeholder.com/800x450">
            <source src="sample-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

</body>
</html>
